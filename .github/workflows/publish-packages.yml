name: Publish Packages

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: publish-packages
    cancel-in-progress: false

jobs:
    publish:
        name: Publish
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: pnpm
                  registry-url: https://registry.npmjs.org

            - run: pnpm install --frozen-lockfile

            - run: pnpm build

            - run: pnpm test

            - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  publish-script: pnpm release
                  version-script: pnpm version-packages
                  pr-title: "chore: version packages"
                  commit-message: "chore: version packages"
              env:
                  # Read by @changesets/changelog-github during `changeset version` to resolve PR/author links.
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
