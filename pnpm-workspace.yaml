packages:
  - "packages/*"

# Supply-chain hardening (BLU-2696)
minimumReleaseAge: 20160 # 14 days, in minutes — requires pnpm >= 10.16
# pnpm 10 blocks all third-party install scripts by default. These keys make that
# policy explicit:
#   onlyBuiltDependencies — allow-list of deps permitted to run install scripts (empty:
#     nothing is trusted; tsdown/rolldown/oxc ship prebuilt binaries and need nothing).
#   ignoredBuiltDependencies — deps whose install scripts are explicitly denied (silences
#     the "ignored build scripts" notice). sharp loads prebuilt @img/sharp-* platform
#     packages at runtime; its install script is a no-op binary-fetch fallback. sharp is
#     transitive via next in the private @bluprynt/playground only (never published).
onlyBuiltDependencies: []
ignoredBuiltDependencies:
  - sharp

catalog:
  typescript: "5.9.3"
  tsdown: "0.21.1"
  react: "19.1.0"
  "@types/react": "19.1.8"
  jest: "29.7.0"
  ts-jest: "29.4.6"
  "@types/jest": "29.5.14"
  ajv: "8.18.0"
  "@testing-library/react": "16.3.2"
  "@types/react-dom": "19.1.6"
  jest-environment-jsdom: "30.3.0"
  react-dom: "19.1.0"
  "@dnd-kit/abstract": "0.3.2"
  "@dnd-kit/dom": "0.3.2"
  "@dnd-kit/helpers": "0.3.2"
  "@dnd-kit/react": "0.3.2"
  "@dnd-kit/state": "0.3.2"
  "@biomejs/biome": "2.4.6"
  knip: "5.86.0"
  sherif: "1.10.0"
  turbo: "2.8.15"
  tw-animate-css: "1.4.0"
  "@changesets/cli": "2.30.0"
  "@changesets/changelog-github": "0.6.0"
